<script>
const appEl=document.getElementById('app'), pageEl=document.getElementById('page');
const DEFAULT_MENU={"Dürümler":[['Enfes Dürüm',120,100],['Ultra Dürüm',140,120],['Mega Dürüm',170,150],['Double Dürüm',200,200],['Öğrenci Dürüm',120,80]],"Porsiyonlar":[['Küçük Paket',250,300],['Orta Paket',400,500],['Avantaj Paket',470,600],['Büyük Paket',580,750],['Aile Boyu',750,1000]],"Extra":[['Doritos',20,0],['Lavaş',10,0]],"İçecekler":[['Kutu İçecekler',70,0],['Büyük Ayran',45,0],['Küçük Ayran',35,0],['Litrelik İçecekler',90,0],['Şalgam 330 ml',45,0]]};
function loadMenu(){try{let x=JSON.parse(localStorage.getItem('cig_menu')||'null');return x&&typeof x==='object'?x:JSON.parse(JSON.stringify(DEFAULT_MENU))}catch(e){return JSON.parse(JSON.stringify(DEFAULT_MENU))}}
let MENU=loadMenu();
function saveMenu(){localStorage.setItem('cig_menu',JSON.stringify(MENU))}

const STOCK_KEY='cig_stock';
const STOCK_ITEMS=['Çiğköfte','Lavaş','Doritos','Kutu İçecekler','Büyük Ayran','Küçük Ayran','Litrelik İçecekler','Şalgam 330 ml'];
const STOCK_UNITS={'Çiğköfte':'kg','Lavaş':'adet','Doritos':'adet','Kutu İçecekler':'adet','Büyük Ayran':'adet','Küçük Ayran':'adet','Litrelik İçecekler':'adet','Şalgam 330 ml':'adet'};
function stockData(){return JSON.parse(localStorage.getItem(STOCK_KEY)||'{}')}
function saveStockData(d){localStorage.setItem(STOCK_KEY,JSON.stringify(d))}
function stockValue(name){let d=stockData();return d[name]?.value===undefined?'':+d[name].value}
function tracked(name){let d=stockData();return Object.prototype.hasOwnProperty.call(d,name)&&d[name]?.value!==''&&d[name]?.value!==undefined}
function stockStatus(name){if(!tracked(name))return '';let v=+stockValue(name)||0,u=STOCK_UNITS[name]||'adet';return `${v} ${u}`}
function consumeForItems(items){let d=stockData();items.forEach(i=>{if(i.grams>0&&STOCK_UNITS['Çiğköfte']){if(tracked('Çiğköfte'))d['Çiğköfte'].value=Math.max(0,(+d['Çiğköfte'].value||0)-((i.grams*i.qty)/1000));}let n=i.name;if(n==='Lavaş'||n==='Doritos'||STOCK_UNITS[n]==='adet'){if(tracked(n))d[n].value=Math.max(0,(+d[n].value||0)-i.qty)}});saveStockData(d)}
function restoreStockForItems(items){let d=stockData();items.forEach(i=>{if(i.grams>0&&tracked('Çiğköfte'))d['Çiğköfte'].value=(+d['Çiğköfte'].value||0)+((i.grams*i.qty)/1000);let n=i.name;if(n==='Lavaş'||n==='Doritos'||STOCK_UNITS[n]==='adet'){if(tracked(n))d[n].value=(+d[n].value||0)+i.qty}});saveStockData(d)}
function requiredStock(items){let r={};items.forEach(i=>{if(i.grams>0)r['Çiğköfte']=(r['Çiğköfte']||0)+(i.grams*i.qty/1000);let n=i.name;if(n==='Lavaş'||n==='Doritos'||STOCK_UNITS[n]==='adet')r[n]=(r[n]||0)+i.qty});return r}
function stockCheck(items){let r=requiredStock(items),d=stockData(),bad=[];Object.entries(r).forEach(([n,q])=>{if(tracked(n)&&(+d[n].value||0)+1e-9<q)bad.push(`${n}: ${stockStatus(n)} kaldı, ${q.toFixed(n==='Çiğköfte'?3:0)} ${STOCK_UNITS[n]} gerekli`)});return bad}
const ONLINE=['Yemeksepeti','Trendyol Go','Migros'];const TYPES=['Tezgah / Paket',...ONLINE];let KG=+(localStorage.getItem('cig_costkg')||175);let cat='Dürümler',cart=[],pay='cash',otype='Tezgah / Paket',active='order',editingId=null,editingMeta=null;const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(+n||0);const pad=n=>String(n).padStart(2,'0');const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};const month=d=>d.slice(0,7);

// Firestore senkronizasyonu
let db=null, cloudOrders=null, cloudReady=false, cloudSyncUnsub=null, cloudMigrationStarted=false;
function localOrders(){try{return JSON.parse(localStorage.getItem('cig_orders')||'[]')}catch(e){return []}}
function orders(){return cloudOrders!==null?cloudOrders:localOrders()}
function setLocalOrders(os){localStorage.setItem('cig_orders',JSON.stringify(os))}
async function syncOrdersToCloud(os){if(!db||!firebase.auth().currentUser)return;const uid=firebase.auth().currentUser.uid;const batch=db.batch();os.forEach(o=>{const id=String(o.id);batch.set(db.collection('users').doc(uid).collection('orders').doc(id),o,{merge:true})});if(os.length)await batch.commit()}
function startFirestoreSync(user){
  if(!db)db=firebase.firestore();
  cloudReady=false; cloudMigrationStarted=false; cloudOrders=null;
  if(cloudSyncUnsub)cloudSyncUnsub();
  const ref=db.collection('users').doc(user.uid).collection('orders');
  cloudSyncUnsub=ref.onSnapshot(async snap=>{
    const incoming=snap.docs.map(d=>d.data()).sort((a,b)=>(+b.id||0)-(+a.id||0));
    const local=localOrders();
    if(!snap.empty || local.length===0 || cloudMigrationStarted){
      cloudOrders=incoming; setLocalOrders(incoming); cloudReady=true; updateTarget();
      return;
    }
    cloudMigrationStarted=true;
    cloudOrders=local; setLocalOrders(local); cloudReady=true;
    try{await syncOrdersToCloud(local);}
    catch(e){console.error('Firestore ilk aktarım hatası:',e); cloudMigrationStarted=false; const m=document.getElementById('msg'); if(m)m.innerHTML='<div class="err">Bulut aktarımı başarısız oldu. İnternet bağlantısını kontrol edin.</div>';}
  },err=>{console.error('Firestore dinleme hatası:',err); cloudReady=false; const m=document.getElementById('msg'); if(m)m.innerHTML='<div class="err">Bulut verilerine bağlanılamadı.</div>';});
}
function stopFirestoreSync(){if(cloudSyncUnsub){cloudSyncUnsub();cloudSyncUnsub=null;}cloudOrders=null;cloudReady=false;cloudMigrationStarted=false}
async function saveCloudOrder(o){if(!db||!firebase.auth().currentUser)throw new Error('Oturum yok');const uid=firebase.auth().currentUser.uid;await db.collection('users').doc(uid).collection('orders').doc(String(o.id)).set(o,{merge:true})}
async function deleteCloudOrder(id){if(!db||!firebase.auth().currentUser)throw new Error('Oturum yok');const uid=firebase.auth().currentUser.uid;await db.collection('users').doc(uid).collection('orders').doc(String(id)).delete()}

function backupData(){let blob=new Blob([JSON.stringify({app:'Oses Çiğköfte Adisyon',version:3,exportedAt:new Date().toISOString(),orders:orders()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`oses-cigkofte-yedek-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreData(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.orders))throw Error();if(!confirm(`${d.orders.length} sipariş geri yüklenecek. Mevcut siparişlerin üzerine yazılsın mı?`))return;if(!cloudReady)throw Error('Bulut bağlantısı hazır değil');for(const o of d.orders)await saveCloudOrder(o);cloudOrders=d.orders;setLocalOrders(d.orders);alert('Yedek başarıyla geri yüklendi ve buluta aktarıldı.');renderHistory(today())}catch(e){console.error(e);alert(e.message==='Bulut bağlantısı hazır değil'?'Bulut bağlantısı hazır değil.':'Geçersiz yedek dosyası veya buluta aktarım başarısız.')}};r.readAsText(f)}

function renderStock(){let d=stockData();pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>📦 Stok Takibi</h2><p>Boş bırakılan ürünlerde stok takibi yapılmaz. Kaydettiğiniz stok, satışlarda otomatik azalır.</p></div><button class="primary" style="width:auto;margin-top:0" onclick="saveAllStock()">💾 Stokları Kaydet</button></div><div class="stock-grid">${STOCK_ITEMS.map(n=>`<div class="stock-card"><b>${n}</b><div class="muted">Birim: ${STOCK_UNITS[n]}</div><input class="stock-input" data-stock="${n}" type="number" min="0" step="${n==='Çiğköfte'?'0.001':'1'}" placeholder="Takip kapalı" value="${tracked(n)?d[n].value:''}"><div class="stock-current">Mevcut: ${tracked(n)?stockStatus(n):'Takip kapalı'}</div></div>`).join('')}</div><div id="stockMsg"></div></section>`}
function saveAllStock(){let d=stockData();document.querySelectorAll('[data-stock]').forEach(i=>{let n=i.dataset.stock,v=i.value.trim();if(v==='')delete d[n];else d[n]={value:+v,unit:STOCK_UNITS[n]}});saveStockData(d);renderStock();let m=document.getElementById('stockMsg');if(m)m.innerHTML='<div class="ok">✓ Stoklar kaydedildi. Bundan sonraki satışlarda otomatik düşecektir.</div>'}
function renderHistory(date){let os=orders().filter(o=>!date||o.businessDate===date).sort((a,b)=>b.id-a.id);pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>Geçmiş Siparişler</h2><p>Tüm detaylar ve gün filtresi</p></div><div class="filter"><input class="date" id="hdate" type="date" value="${date||''}" onchange="renderHistory(this.value)"><button onclick="renderHistory('')">Tümü</button><button onclick="backupData()">💾 Yedekle</button><label class="filter-upload">↥ Geri Yükle<input type="file" accept="application/json" onchange="restoreData(this)" style="display:none"></label></div></div>${os.map(o=>`<article class="history-card"><div class="head"><div><b>${o.orderType}</b><div class="muted">${o.businessDate}</div></div><div class="amount">${money(o.total)}</div></div><div class="chips"><span class="chip">${o.items.map(i=>`${i.name} ×${i.qty}`).join(', ')}</span><span class="chip">${o.online?'Online':o.payment.method==='split'?`Parçalı ${money(o.payment.cash)} + ${money(o.payment.card)}`:o.payment.method==='card'?'Kredi Kartı':'Nakit'}</span><span class="chip">İndirim ${money(o.discount)}</span><span class="chip">Köfte ${(o.grams/1000).toFixed(3)} kg</span></div>${o.note?`<p>${o.note}</p>`:''}<button onclick="editOrder(${o.id})">✏️ Düzenle</button><button onclick="printOrder(${o.id})">🧾 Yazdır</button><button class="danger" onclick="deleteOrder(${o.id})">Sil</button></article>`).join('')||'<p class="muted">Kayıt bulunamadı.</p>'}</section>`}

function firebaseLogin(){
  const email=document.getElementById('fbEmail').value.trim();
  const password=document.getElementById('fbPassword').value;
  const err=document.getElementById('fbError');
  if(!email||!password){
    err.textContent='E-posta ve şifreyi girin.';
    err.style.display='block';
    return;
  }
  err.style.display='none';
  firebase.auth().signInWithEmailAndPassword(email,password).catch(e=>{
    err.textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')
      ? 'E-posta veya şifre hatalı.'
      : (e.message||'Giriş yapılamadı.');
    err.style.display='block';
  });
}
function firebaseLogout(){
  firebase.auth().signOut();
}

document.addEventListener('DOMContentLoaded',()=>{
  const gate=document.getElementById('firebaseAuthGate');
  const app=document.getElementById('app');
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(user=>{
    if(user){
      gate.style.display='none';
      app.style.display='block';
      initTheme();
      show();
      startFirestoreSync(user);
    }else{
      stopFirestoreSync();
      app.style.display='none';
      gate.style.display='grid';
    }
  });
});
