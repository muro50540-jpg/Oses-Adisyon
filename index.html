function startFirestoreSync(user){
  if(!db)db=firebase.firestore();
  updateCloudStatus('connecting'); cloudReady=false; cloudMigrationStarted=false; cloudInitialSyncDone=false; cloudOrders=null;
  if(cloudSyncUnsub)cloudSyncUnsub();
  const ref=db.collection('users').doc(user.uid).collection('orders');
  cloudSyncUnsub=ref.onSnapshot(async snap=>{
    const incoming=snap.docs.map(d=>d.data()).sort((a,b)=>(+b.id||0)-(+a.id||0));
    const local=localOrders();
    // İlk bağlantıda Firestore boşsa, eski localStorage verisini yalnızca BİR KEZ buluta aktar.
    // Sonraki boş snapshot'larda local veriyi geri yazma; aksi halde silinen siparişler yeniden oluşur.
    if(!cloudInitialSyncDone){
      cloudInitialSyncDone=true;
      if(snap.empty && local.length>0){
        cloudMigrationStarted=true;
        cloudOrders=local; setLocalOrders(local); cloudReady=false; updateCloudStatus('connecting','Eski yerel veriler güvenli şekilde buluta aktarılıyor…'); 
        try{
          await syncOrdersToCloud(local);
          cloudReady=true; updateCloudStatus('ready'); 
        }
        catch(e){
          console.error('Firestore ilk aktarım hatası:',e);
          cloudMigrationStarted=false; cloudInitialSyncDone=false; cloudReady=false;
          updateCloudStatus('error',e.message||'İlk veri aktarımı başarısız');

        }
      }else{
        cloudOrders=incoming; setLocalOrders(incoming); cloudReady=true; updateCloudStatus('ready'); 
      }
      return;
    }
    // İlk senkron tamamlandıktan sonra Firestore tek gerçek kaynak olur.
    cloudOrders=incoming; setLocalOrders(incoming); cloudReady=true; updateCloudStatus('ready'); 
  },err=>{console.error('Firestore dinleme hatası:',err);cloudReady=false;updateCloudStatus('error',err.code||err.message||'Firestore bağlantı hatası');const m=document.getElementById('msg');if(m)m.innerHTML='<div class="err">Bulut verilerine bağlanılamadı. Sağ üstteki bulut düğmesine basarak tekrar deneyin.</div>';});
}

async function removeOperation(id){
  if(!confirm('Bu kaydı silmek istiyor musunuz?'))return;
  try{
    const events=await loadCloudOperations(today());
    const old=events.find(o=>String(o.id)===String(id));
    await deleteCloudOperation(id);
    if((old?.type==='Fire'||old?.type==='İkram') && (+old.grams||0)>0 && tracked('Çiğköfte')){
      const d=stockData();
      d['Çiğköfte'].value=(+d['Çiğköfte'].value||0)+((+old.grams||0)/1000);

function adjustStock(encoded,delta){const n=decodeURIComponent(encoded),d=stockData(),unit=STOCK_UNITS[n]||'adet';if(!tracked(n)){d[n]={value:0,unit,min:STOCK_DEFAULT_MIN[n]||0};}const step=unit==='kg'?0.001:1;d[n].value=Math.max(0,(+d[n].value||0)+delta*step);d[n].unit=unit;saveStockData(d);saveCloudStock().catch(console.error);renderStock();}
async function resetAllStock(){if(!confirm('TÜM stoklar sıfırlansın mı? Bu işlem tüm mevcut stok miktarlarını 0 yapar.'))return;const d=stockData();Object.keys(d).forEach(n=>{d[n].value=0});STOCK_ITEMS.forEach(n=>{if(!d[n])d[n]={value:0,unit:STOCK_UNITS[n]||'adet',min:STOCK_DEFAULT_MIN[n]||0};});saveStockData(d);try{await saveCloudStock();}catch(e){console.error(e)}renderStock();alert('Tüm stoklar sıfırlandı.');}
function saveAllStock(){let d=stockData();document.querySelectorAll('[data-stock]').forEach(i=>{let n=i.dataset.stock,v=i.value.trim();if(v==='')delete d[n];else d[n]={...(d[n]||{}),value:+v,unit:STOCK_UNITS[n],min:+(document.querySelector(`[data-min="${n}"]`)?.value||STOCK_DEFAULT_MIN[n]||0)}});saveStockData(d);saveCloudStock().catch(console.error);renderStock()}
async function savePurchase(){const supplierId=document.getElementById('purchaseSupplier')?.value;const suppliers=await loadCloudSuppliers();const supplier=suppliers.find(x=>String(x.id)===String(supplierId));if(!supplier)return alert('Önce tedarikçi ekleyin.');const date=document.getElementById('purchaseDate').value||today(),d=stockData(),items=[];let total=0;STOCK_ITEMS.forEach((n,i)=>{const q=Math.max(0,+document.getElementById('buy_'+i).value||0),price=Math.max(0,+document.getElementById('buyprice_'+i).value||0);if(q){const old=d[n]||{value:0,unit:STOCK_UNITS[n],min:STOCK_DEFAULT_MIN[n]||0};d[n]={...old,value:(+old.value||0)+q,unit:STOCK_UNITS[n]};items.push({name:n,qty:q,unit:STOCK_UNITS[n],unitPrice:price,total:q*price});total+=q*price;}});if(!items.length)return alert('En az bir ürün miktarı girin.');if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');const o={id:Date.now(),businessDate:date,createdAt:new Date().toISOString(),supplier:supplier.name,supplierId:supplier.id,items,total,note:(document.getElementById('purchaseNote').value||'').trim()};try{await savePurchaseAndStockCloud(o,d);saveStockData(d);await renderStock();alert('Alım kaydedildi ve stoğa eklendi.');}catch(e){console.error(e);alert('Alım kaydedilemedi; stok ve alım birlikte geri bırakıldı.');}}
async function saveSupplier(){const name=(document.getElementById('supplierName').value||'').trim(),phone=(document.getElementById('supplierPhone').value||'').replace(/\D/g,'');if(!name||!phone)return alert('Tedarikçi adı ve WhatsApp numarası girin.');if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');try{await saveSupplierCloud({id:Date.now(),name,phone});await renderStock();}catch(e){console.error(e);alert('Tedarikçi kaydedilemedi.');}}
async function removeSupplier(id){if(!confirm('Tedarikçi silinsin mi?'))return;try{await deleteSupplierCloud(id);await renderStock();}catch(e){console.error(e);alert('Tedarikçi silinemedi.');}}

async function renderProcurement(){const suppliers=await loadCloudSuppliers();const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);const date=`${tomorrow.getFullYear()}-${pad(tomorrow.getMonth()+1)}-${pad(tomorrow.getDate())}`;const rows=STOCK_ITEMS.map((n,i)=>`<div class="proc-item"><div><b>${n}</b><small>${STOCK_UNITS[n]}</small></div><input id="orderQty_${i}" type="number" min="0" step="${STOCK_UNITS[n]==='kg'?'0.001':'1'}" placeholder="Miktar"></div>`).join('');pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>🛒 Yarın İçin Sipariş</h2><p>Tedarikçiyi seç, ürünleri gir, WhatsApp mesajını hazırla.</p></div><button onclick="view('stock')">📦 Stok & Alım</button></div><div class="proc-grid"><div class="field"><label>Tedarikçi</label><select id="orderSupplier">${suppliers.map(x=>`<option value="${x.id}">${x.name} — ${x.phone||''}</option>`).join('')}</select></div><div class="field"><label>Teslim tarihi</label><input id="orderDate" type="date" value="${date}"></div></div><div class="proc-items">${rows}</div><div class="field"><label>Mesaj notu</label><textarea id="orderNote" rows="3" placeholder="Örn. Sabah 09:00 gibi bırakabilir misiniz?"></textarea></div><div id="orderPreview" class="order-preview">Ürün miktarlarını girince WhatsApp mesajı burada görünecek.</div><div class="wp-actions"><button class="whatsapp-btn" onclick="sendWhatsAppOrder()">🟢 WhatsApp'tan Gönder</button><button onclick="saveTomorrowOrder()">💾 Siparişi Kaydet</button></div></section>`;document.querySelectorAll('[id^="orderQty_"]').forEach(x=>x.addEventListener('input',updateProcurementPreview));document.getElementById('orderDate').addEventListener('change',updateProcurementPreview);document.getElementById('orderSupplier').addEventListener('change',updateProcurementPreview);updateProcurementPreview();}

const DISTRIBUTOR_PRODUCTS=[
 {name:'Çiğköfte',unit:'kg',price:175},

 {name:'Islak Mendil',unit:'koli',price:1000},
 {name:'Nar Ekşisi',unit:'koli',price:900},
 {name:'Burger Sos',unit:'koli',price:1800},

let distributorEditId=null;

function saveDistributorDebtData(){localStorage.setItem('oses_distributor_payments',JSON.stringify(distributorPayments));if(db&&firebase.auth().currentUser){const uid=firebase.auth().currentUser.uid;return db.collection('users').doc(uid).collection('settings').doc('main').set({distributorPayments,updatedAt:new Date().toISOString()},{merge:true}).catch(console.error)}return Promise.resolve()}
function applyDistributorDebtData(d){if(d&&typeof d==='object'){distributorPayments=d;localStorage.setItem('oses_distributor_payments',JSON.stringify(distributorPayments))}}
function distributorMonths(os){const set=new Set((os||[]).map(o=>month(o.businessDate)));const now=month(today());set.add(now);const a=[...set].sort();if(!a.length)return[now];const f=a[0].split('-').map(Number),l=now.split('-').map(Number),out=[];let y=f[0],m=f[1];while(y<l[0]||(y===l[0]&&m<=l[1])){out.push(`${y}-${pad(m)}`);m++;if(m>12){m=1;y++}}return out}
function distributorDebtRows(os){let carry=0;return distributorMonths(os).map(ym=>{const purchases=(os||[]).filter(o=>month(o.businessDate)===ym).reduce((s,o)=>s+(+o.total||0),0),opening=carry,due=opening+purchases,rec=distributorPayments[ym]||{},paid=Math.min(Math.max(0,+rec.paid||0),due),remaining=Math.max(0,due-paid);carry=remaining;return{ym,opening,purchases,due,paid,remaining,paymentDate:rec.date||'',status:remaining===0&&due>0?'paid':paid>0?'partial':'unpaid'}})}
async function saveDistributorPayment(){const ym=document.getElementById('distPayMonth')?.value||month(today()),os=await loadDistributorOrders(),row=distributorDebtRows(os).find(x=>x.ym===ym);if(!row)return;const paid=Math.max(0,+document.getElementById('distPaidAmount')?.value||0);if(paid>row.due)return alert(`Ödeme borçtan fazla olamaz. En fazla ${money(row.due)}.`);distributorPayments[ym]={paid,date:document.getElementById('distPaymentDate')?.value||today(),status:paid>=row.due&&row.due>0?'paid':paid>0?'partial':'unpaid'};await saveDistributorDebtData();renderDistributor()}
function clearDistributorPayment(ym){if(!confirm(`${ym} ayının ödeme kaydı silinsin mi?`))return;delete distributorPayments[ym];saveDistributorDebtData().then(renderDistributor)}
async function loadDistributorOrders(){if(!db||!firebase.auth().currentUser)return [];const uid=firebase.auth().currentUser.uid;const snap=await db.collection('users').doc(uid).collection('procurementOrders').get();return snap.docs.map(d=>d.data()).sort((a,b)=>String(b.businessDate).localeCompare(String(a.businessDate))||(+b.id||0)-(+a.id||0))}
async function deleteDistributorOrder(id){if(!confirm('Bu alım silinsin mi?'))return;const uid=firebase.auth().currentUser.uid;await db.collection('users').doc(uid).collection('procurementOrders').doc(String(id)).delete();renderDistributor()}
function distributorQtyTotal(items){return (items||[]).filter(x=>x.unit==='kg'&&x.name==='Çiğköfte').reduce((s,x)=>s+(+x.qty||0),0)}
function distributorShipping(kg,items=[]){kg=Math.max(0,+kg||0);const lavash=(items||[]).filter(x=>String(x.name).toLowerCase()==='lavaş').reduce((s,x)=>s+(+x.qty||0),0);const hasKoli=(items||[]).some(x=>String(x.unit||'').toLowerCase()==='koli');if(kg===10&&lavash===2&&!hasKoli)return 150;if(kg>10)return 300;if(hasKoli&&kg>=10)return 300;return 0}
function distributorTotal(items){const base=(items||[]).reduce((s,x)=>s+(+x.total||(+x.qty||0)*(+x.unitPrice||0)),0);return base+distributorShipping(distributorQtyTotal(items),items)}
async function saveDistributorOrder(){const date=document.getElementById('distDate').value||today(),note=(document.getElementById('distNote').value||'').trim(),items=[];DISTRIBUTOR_PRODUCTS.forEach((p,i)=>{const q=Math.max(0,+document.getElementById('distQty_'+i)?.value||0),price=Math.max(0,+document.getElementById('distPrice_'+i)?.value||0);if(q)items.push({name:p.name,qty:q,unit:p.unit,unitPrice:price,total:q*price})});if(!items.length)return alert('En az bir ürün miktarı girin.');const kg=distributorQtyTotal(items),shipping=distributorShipping(kg,items),base=items.reduce((s,x)=>s+x.total,0),o={id:distributorEditId||Date.now(),businessDate:date,createdAt:new Date().toISOString(),items,baseTotal:base,shipping,total:base+shipping,note};if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');try{const d=stockData();items.forEach(x=>{if(!STOCK_ITEMS.includes(x.name)){STOCK_ITEMS.push(x.name);STOCK_UNITS[x.name]=x.unit}const old=d[x.name]||{value:0,unit:x.unit,min:STOCK_DEFAULT_MIN[x.name]||0};d[x.name]={...old,value:(+old.value||0)+(+x.qty||0),unit:x.unit};});saveStockConfig();saveStockData(d);await saveCloudStock();await saveProcurementCloud(o);await saveCloudSettings();distributorEditId=null;renderDistributor();}catch(e){console.error(e);alert('Distribütör alımı kaydedilemedi.')}}
async function addDistributorProduct(){const name=(document.getElementById('newDistName')?.value||'').trim(),unit=document.getElementById('newDistUnit')?.value||'adet',price=Math.max(0,+document.getElementById('newDistPrice')?.value||0);if(!name)return alert('Ürün adı girin.');if(DISTRIBUTOR_PRODUCTS.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('Bu ürün zaten listede.');DISTRIBUTOR_PRODUCTS.push({name,unit,price});await persistSettings('✓ Distribütör ürünü eklendi.');renderDistributor()}

async function renderDistributor(edit=null){const os=await loadDistributorOrders(),ym=month(today()),rows=distributorDebtRows(os),cur=rows.find(x=>x.ym===ym)||{ym,opening:0,purchases:0,due:0,paid:0,remaining:0},allDebt=rows.reduce((s,x)=>s+x.remaining,0);const prod=DISTRIBUTOR_PRODUCTS.map((p,i)=>{const it=edit?.items?.find(x=>x.name===p.name);return `<div class="purchase-item"><b>${escHtml(p.name)}</b><small>${escHtml(p.unit)}</small><input id="distQty_${i}" type="number" min="0" step="${p.unit==='kg'?'0.001':'1'}" value="${it?.qty||''}" placeholder="Miktar"><input id="distPrice_${i}" type="number" min="0" step="0.01" value="${it?.unitPrice??p.price}" placeholder="Birim fiyat"></div>`}).join('');const hist=os.map(o=>`<div class="purchase-row"><div><b>${o.businessDate}</b><br>${(o.items||[]).map(i=>`${escHtml(i.name)}: ${i.qty} ${i.unit} × ${money(i.unitPrice)}`).join(' • ')}</div><div><b>${money(o.total)}</b><br><small>Kargo ${money(o.shipping||0)}</small></div><div><button onclick="editDistributorOrder(${o.id})">Düzenle</button><button class="danger" onclick="deleteDistributorOrder(${o.id})">Sil</button></div></div>`).join('')||'<p class="muted">Henüz distribütör alımı yok.</p>';const debt=rows.slice().reverse().map(x=>`<div class="debt-month"><div class="debt-head"><b>${x.ym}</b><span class="${x.remaining?'debt-red':'debt-green'}">${x.remaining?'Kalan Borç '+money(x.remaining):'Borç Ödendi'}</span></div><div class="debt-grid"><span>Geçen aydan devreden borç</span><b>${money(x.opening)}</b><span>Bu ay alım</span><b>${money(x.purchases)}</b><span>Toplam borç</span><b>${money(x.due)}</b><span class="debt-green">Ödenen</span><b class="debt-green">${money(x.paid)}</b><span class="debt-red">Devreden</span><b class="debt-red">${money(x.remaining)}</b></div>${x.opening?`<div class="carry-note">↪ ${x.ym} • Geçen aydan devreden borç: ${money(x.opening)}</div>`:''}</div>`).join('');const chart=rows.map(x=>{const max=Math.max(x.due,1),p=Math.min(100,x.paid/max*100),r=Math.min(100,x.remaining/max*100);return `<div class="debt-chart-row"><div class="debt-chart-label"><b>${x.ym}</b><span>${money(x.due)}</span></div><div class="debt-bar"><span class="bar-paid" style="width:${p}%"></span><span class="bar-remaining" style="width:${r}%;left:${p}%"></span></div><div class="debt-chart-legend"><span class="debt-green">● Ödenen ${money(x.paid)}</span><span class="debt-red">● Kalan ${money(x.remaining)}</span></div></div>`}).join('');pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>🚚 Distribütör / Alımlar</h2><p>Sabit ürün fiyatları, kargo ve distribütöre borç takibi.</p></div></div><div class="report-grid"><div class="stat"><span>Bu Ay Toplam Borç</span><b>${money(cur.due)}</b></div><div class="stat"><span class="debt-green">Bu Ay Ödenen</span><b class="debt-green">${money(cur.paid)}</b></div><div class="stat"><span class="debt-red">Bu Ay Kalan / Devir</span><b class="debt-red">${money(cur.remaining)}</b></div><div class="stat"><span>Toplam Kalan Borç</span><b>${money(allDebt)}</b></div></div><section class="panel report-panel"><h3>${edit?'✏️ Alımı Düzenle':'➕ Yeni Distribütör Alımı'}</h3><div class="proc-grid"><div class="field"><label>Tarih</label><input id="distDate" type="date" value="${edit?.businessDate||today()}"></div><div class="field wide"><label>Not</label><input id="distNote" value="${escHtml(edit?.note||'')}" placeholder="Fatura / not"></div></div><div class="purchase-items">${prod}</div><div class="settings-add"><h3>➕ Manuel Ürün Ekle</h3><div class="proc-grid"><div class="field"><label>Ürün adı</label><input id="newDistName" placeholder="Örn. Mezopotamya Sosu"></div><div class="field"><label>Birim</label><select id="newDistUnit"><option>adet</option><option>koli</option><option>kg</option><option>paket</option></select></div><div class="field"><label>Birim fiyatı</label><input id="newDistPrice" type="number" min="0" step="0.01"></div><button onclick="addDistributorProduct()">Ürünü Ekle</button></div></div> end"><span class="debt-green">● Ödenen</span><span class="debt-red">● Kalan / devreden</span></div></section><section class="panel report-panel"><h3>📋 Aylık Borç Dökümü</h3>${debt}</section><section class="panel report-panel"><div class="sectionhead"><h3>📋 Geçmiş Distribütör Alımları</h3><input class="date" type="month" value="${ym}" onchange="filterDistributorMonth(this.value)"></div><div id="distHistory">${hist}</div></section></section>`}
async function filterDistributorMonth(ym){const os=await loadDistributorOrders(),f=os.filter(o=>month(o.businessDate)===ym),x=distributorDebtRows(os).find(x=>x.ym===ym)||{opening:0,purchases:0,due:0,paid:0,remaining:0};const el=document.getElementById('distHistory');if(el)el.innerHTML=`<div class="debt-month"><div class="debt-head"><b>${ym}</b><span class="${x.remaining?'debt-red':'debt-green'}">${x.remaining?'Kalan Borç '+money(x.remaining):'Borç Ödendi'}</span></div><div class="debt-grid"><span>Geçen aydan devreden borç</span><b>${money(x.opening)}</b><span>Bu ay alım</span><b>${money(x.purchases)}</b><span>Toplam borç</span><b>${money(x.due)}</b><span class="debt-green">Ödenen</span><b class="debt-green">${money(x.paid)}</b><span class="debt-red">Devreden</span><b class="debt-red">${money(x.remaining)}</b></div></div>${f.map(o=>`<div class="purchase-row"><div><b>${o.businessDate}</b><br>${(o.items||[]).map(i=>`${escHtml(i.name)}: ${i.qty} ${i.unit}`).join(' • ')}</div><div><b>${money(o.total)}</b></div><div><button onclick="editDistributorOrder(${o.id})">Düzenle</button><button class="danger" onclick="deleteDistributorOrder(${o.id})">Sil</button></div></div>`).join('')||'<p class="muted">Bu ay alım yok.</p>'}`}

async function saveTomorrowOrder(silent=false){const p=await procurementMessage();if(!p.supplier||!p.items.length)return silent?null:alert('Tedarikçi ve ürün seçin.');if(!(await waitForCloud()))return silent?null:alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');try{await saveProcurementCloud({id:Date.now(),businessDate:p.date,createdAt:new Date().toISOString(),supplier:p.supplier.name,supplierId:p.supplier.id,items:p.items,note:p.note,message:p.message});if(!silent)alert('Sipariş kaydedildi.');}catch(e){console.error(e);if(!silent)alert('Sipariş kaydedilemedi.')}}

async function readCloudCollection(name){if(!db||!firebase.auth().currentUser)return [];const uid=firebase.auth().currentUser.uid;const snap=await db.collection('users').doc(uid).collection(name).get();return snap.docs.map(d=>d.data())}
async function writeCloudCollection(name,docs){if(!db||!firebase.auth().currentUser)return;const uid=firebase.auth().currentUser.uid;for(let i=0;i<docs.length;i+=450){const batch=db.batch();docs.slice(i,i+450).forEach(o=>{const id=String(o.id);batch.set(db.collection('users').doc(uid).collection(name).doc(id),o,{merge:true})});if(docs.slice(i,i+450).length)await batch.commit()}}
async function backupData(){if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');try{const data={version:2,createdAt:new Date().toISOString(),orders:orders(),operations:await readCloudCollection('operations'),stock:stockData(),purchases:await readCloudCollection('purchases'),suppliers:await readCloudCollection('suppliers'),procurementOrders:await readCloudCollection('procurementOrders'),settings:{menu:MENU,stockItems:STOCK_ITEMS,stockUnits:STOCK_UNITS,kgCost:KG,onlinePlatforms:ONLINE,onlineCommission:ONLINE_COMMISSION,onlinePrices:ONLINE_PRICES,distributorPayments}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`oses-yedek-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){console.error(e);alert('Yedek oluşturulamadı.')}}
async function restoreData(input){const file=input?.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data!=='object')throw new Error('Geçersiz yedek');if(!confirm('Yedek veriler mevcut verilerle birleştirilsin mi? Eşleşen kayıtlar güncellenecek.')){input.value='';return}if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');if(Array.isArray(data.orders))await writeCloudCollection('orders',data.orders);if(Array.isArray(data.operations))await writeCloudCollection('operations',data.operations);if(Array.isArray(data.purchases))await writeCloudCollection('purchases',data.purchases);if(Array.isArray(data.suppliers))await writeCloudCollection('suppliers',data.suppliers);if(Array.isArray(data.procurementOrders))await writeCloudCollection('procurementOrders',data.procurementOrders);if(data.stock&&typeof data.stock==='object'){saveStockData(data.stock);await saveCloudStock()}if(data.settings&&typeof data.settings==='object'){const d=data.settings;applyCloudSettings(d);await saveCloudSettings()}if(Array.isArray(data.orders)){cloudInitialSyncDone=true}await new Promise(r=>setTimeout(r,700));alert('Yedek geri yüklendi.');renderHistory(lastHistoryState||{});}catch(e){console.error(e);alert('Yedek geri yüklenemedi. Dosya bozuk veya uyumsuz olabilir.')}finally{if(input)input.value=''}}

function showOrderDetails(id){const o=orders().find(x=>String(x.id)===String(id));if(!o)return;const p=o.payment||{};const paymentText=o.online?'Online':p.method==='split'?`Parçalı ödeme — Nakit ${money(p.cash||0)} + Kart ${money(p.card||0)}`:p.method==='card'?'Kredi Kartı':'Nakit';const profit=(o.total||0)-((o.grams||0)/1000)*KG;const items=(o.items||[]).map(i=>`<div class="detail-row"><span>${escHtml(i.name)} × ${i.qty}<small style="display:block;color:#888">${i.grams||0} g / adet</small></span><b>${money((i.price||0)*(i.qty||0))}</b></div>`).join('');const cancelled=!!o.cancelled;document.getElementById('orderDetailContent').innerHTML=`<div class="order-detail-head"><div><h3>🧾 Sipariş Detayı</h3><div class="muted">${o.businessDate} • ${new Date(o.createdAt||o.id).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} • #${o.id}</div></div><button class="order-detail-close" onclick="closeOrderDetails()">×</button></div>${cancelled?`<div class="cancelled-banner">❌ İptal Edildi • ${escHtml(o.cancelReason||'Nedeni belirtilmemiş')}</div>`:''}<div class="detail-grid"><div class="detail-item"><small>Ödeme</small><b>${paymentText}</b></div><div class="detail-item"><small>Çiğköfte</small><b>${((o.grams||0)/1000).toFixed(3)} kg</b></div><div class="detail-item"><small>İndirim</small><b>${money(o.discount||0)}</b></div><div class="detail-item"><small>Kâr</small><b>${money(profit)}</b></div>${o.phone?`<div class="detail-item"><small>Müşteri telefonu</small><b>${escHtml(o.phone)}</b></div>`:''}</div><div class="detail-items">${items||'<div class="muted">Ürün yok.</div>'}</div><div class="detail-row"><span>Ara toplam</span><b>${money(o.subtotal||((o.total||0)+(o.discount||0)))}</b></div><div class="detail-row"><span>İndirim</span><b>-${money(o.discount||0)}</b></div><div class="detail-row detail-total"><span>TOPLAM</span><b>${money(o.total||0)}</b></div>${o.note?`<div class="detail-item" style="margin-top:10px"><small>Açıklama</small><div>${escHtml(o.note)}</div></div>`:''}<div class="tracking-detail-actions"><button onclick="printOrder(${o.id})">🧾 Yazdır</button><button onclick="closeOrderDetails();editOrder(${o.id})" ${cancelled?'disabled':''}>✏️ Düzenle</button>${!cancelled?`<button class="danger" onclick="showCancelForm(${o.id})">❌ İptal Et</button>`:''}<button class="danger" style="background:#7f1d1d!important" onclick="deleteOrder(${o.id})">🗑️ Sil</button></div><div id="cancelForm_${o.id}"></div>`;document.getElementById('orderDetailModal').classList.add('open')}
function showCancelForm(id){const el=document.getElementById('cancelForm_'+id);if(!el)return;el.innerHTML=`<div class="cancel-box"><b>İptal nedeni zorunludur</b><textarea id="cancelReason_${id}" placeholder="Örn. müşteri vazgeçti, yanlış sipariş..."></textarea><button class="danger" style="width:100%;margin-top:8px" onclick="cancelOrder(${id})">İptali Onayla</button></div>`;document.getElementById('cancelReason_'+id)?.focus()}
async function cancelOrder(id){const reason=(document.getElementById('cancelReason_'+id)?.value||'').trim();if(!reason)return alert('İptal nedeni zorunludur.');if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');const os=orders();const old=os.find(x=>String(x.id)===String(id));if(!old||old.cancelled)return;const updated={...old,cancelled:true,cancelReason:reason,cancelledAt:new Date().toISOString()};try{await saveCloudOrder(updated);restoreStockForItems(old.items||[]);try{await saveCloudStock()}catch(e){console.error(e)}const next=os.map(x=>String(x.id)===String(id)?updated:x);cloudOrders=next;setLocalOrders(next);closeOrderDetails();renderHistory(lastHistoryState||{});}catch(e){console.error(e);alert('Sipariş iptal edilemedi.')}}

let lastHistoryState={mode:'today',date1:today(),date2:today(),pay:'all',q:''};
function historyDateRange(){const st=lastHistoryState||{};if(st.mode==='today')return [today(),today()];if(st.mode==='yesterday'){const d=new Date();d.setDate(d.getDate()-1);const x=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;return [x,x]};return [st.date1||today(),st.date2||st.date1||today()]}
function historyPayment(o){return o.online?'online':(o.payment?.method||'cash')}
function historyFilteredOrders(){const [a,b]=historyDateRange();let os=orders().filter(o=>o.businessDate>=a&&o.businessDate<=b);if(lastHistoryState.pay&&lastHistoryState.pay!=='all')os=os.filter(o=>historyPayment(o)===lastHistoryState.pay);const q=(lastHistoryState.q||'').trim().toLowerCase();if(q)os=os.filter(o=>String(o.id).toLowerCase().includes(q)||String(o.orderNo||'').toLowerCase().includes(q)||String(o.phone||'').toLowerCase().includes(q)||String(o.note||'').toLowerCase().includes(q));return os.sort((x,y)=>y.id-x.id)}
function setHistoryMode(mode){lastHistoryState.mode=mode;renderHistory(lastHistoryState)}
function setHistoryPay(pay){lastHistoryState.pay=pay;renderHistory(lastHistoryState)}
function updateHistorySearch(v){lastHistoryState.q=v;renderHistory(lastHistoryState)}
function updateHistoryRange(which,v){lastHistoryState[which]=v;lastHistoryState.mode='custom';renderHistory(lastHistoryState)}
function renderHistory(state){if(typeof state==='string'){if(state){lastHistoryState={...lastHistoryState,mode:'custom',date1:state,date2:state};}else lastHistoryState={...lastHistoryState,mode:'custom',date1:today(),date2:today()};}else if(state)lastHistoryState={...lastHistoryState,...state};const os=historyFilteredOrders(), active=lastHistoryState, [a,b]=historyDateRange();const valid=os.filter(o=>!o.cancelled);const revenue=valid.reduce((s,o)=>s+(+o.total||0),0);const cancelled=os.filter(o=>o.cancelled).length;const modeLabel=active.mode==='today'?'Bugün':active.mode==='yesterday'?'Dün':'Özel Tarih Aralığı';pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>🧾 Sipariş Takip</h2><p>${modeLabel} • ${a}${a!==b?' → '+b:''}</p></div><div class="filter"><button onclick="backupData()">💾 Yedekle</button><label class="filter-upload">↥ Geri Yükle<input type="file" accept="application/json" onchange="restoreData(this)" style="display:none"></label></div></div><div class="tracking-tools"><div class="tracking-group"><label>TARİH</label><div class="tracking-pills"><button class="${active.mode==='today'?'active':''}" onclick="setHistoryMode('today')">Bugün</button><button class="${active.mode==='yesterday'?'active':''}" onclick="setHistoryMode('yesterday')">Dün</button><button class="${active.mode==='custom'?'active':''}" onclick="setHistoryMode('custom')">Özel Tarih</button></div></div><div class="tracking-group"><label>ÖDEME TİPİ</label><div class="tracking-pills"><button class="${active.pay==='all'?'active':''}" onclick="setHistoryPay('all')">Tümü</button><button class="${active.pay==='cash'?'active':''}" onclick="setHistoryPay('cash')">Nakit</button><button class="${active.pay==='card'?'active':''}" onclick="setHistoryPay('card')">Kart</button><button class="${active.pay==='split'?'active':''}" onclick="setHistoryPay('split')">Parçalı</button><button class="${active.pay==='online'?'active':''}" onclick="setHistoryPay('online')">Online</button></div></div><div class="tracking-group"><label>ARAMA</label><input class="tracking-search" value="${escHtml(active.q||'')}" onkeydown="if(event.key==='Enter'){lastHistoryState.q=this.value;renderHistory(lastHistoryState)}" placeholder="Sipariş no, telefon veya açıklama..."><div style="display:flex;gap:7px;margin-top:7px"><button type="button" onclick="lastHistoryState.q=document.querySelector('.tracking-search')?.value||'';renderHistory(lastHistoryState)" style="padding:9px 12px;border-radius:10px;background:#1689c7;color:#fff;font-weight:800">🔎 Ara</button><span class="muted" style="align-self:center;font-size:11px">Enter ile de arayabilirsiniz</span></div><div class="tracking-range" style="margin-top:7px"><input class="date" type="date" value="${a}" onchange="updateHistoryRange('date1',this.value)"><input class="date" type="date" value="${b}" onchange="updateHistoryRange('date2',this.value)"></div></div></div><div class="tracking-summary"><div class="tracking-stat"><small>Toplam Ciro</small><b>${money(revenue)}</b></div><div class="tracking-stat"><small>Toplam Sipariş Adedi</small><b>${valid.length}</b></div><div class="tracking-stat"><small>İptal Edilen Sipariş</small><b>${cancelled}</b></div></div><div class="tracking-list">${os.map(o=>{const pt=historyPayment(o),ptLabel=pt==='cash'?'Nakit':pt==='card'?'Kart':pt==='split'?'Parçalı':'Online';const products=(o.items||[]).map(i=>`${escHtml(i.name)} ×${i.qty}`).join(', ');const time=new Date(o.createdAt||o.id).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});return `<article class="tracking-card ${o.cancelled?'cancelled':''}" onclick="showOrderDetails(${o.id})"><div class="tracking-card-top"><div><div class="tracking-order">Sipariş #${o.orderNo||o.id}</div><div class="tracking-time">${o.businessDate} • ${time} • ${escHtml(o.orderType||'')}</div></div><div class="tracking-amount">${money(o.total)}</div></div><div class="tracking-tags"><span class="tracking-tag ${pt}">${ptLabel}</span>${o.cancelled?'<span class="tracking-tag cancel">❌ İptal Edildi</span>':'<span class="tracking-tag">✓ Tamamlandı</span>'}</div><div class="tracking-products">${products||'Ürün bilgisi yok'}</div><div class="tracking-meta">${o.phone?`<span>📞 ${escHtml(o.phone)}</span>`:''}${o.grams?`<span>🥙 ${(o.grams/1000).toFixed(3)} kg</span>`:''}${o.discount?`<span>🏷️ İndirim ${money(o.discount)}</span>`:''}</div>${o.note?`<div class="tracking-note">📝 ${escHtml(o.note)}</div>`:''}</article>`}).join('')||'<div class="muted" style="padding:20px;text-align:center">Seçilen filtrelere uygun sipariş bulunamadı.</div>'}</div></section>`}

function toggleProfileMenu(){const m=document.getElementById('profileMenu');if(m)m.classList.toggle('open')}
document.addEventListener('click',e=>{const m=document.getElementById('profileMenu'),b=document.querySelector('.profile-button');if(m&&m.classList.contains('open')&&!m.contains(e.target)&&!b?.contains(e.target))m.classList.remove('open')});
function firebaseLogin(){
  const email=document.getElementById('fbEmail').value.trim();
  const password=document.getElementById('fbPassword').value;
  const err=document.getElementById('fbError');
  if(!email||!password){
    err.textContent='E-posta ve şifreyi girin.';
    err.style.display='block';
    return;
  }
  err.style.display='none';
  firebase.auth().signInWithEmailAndPassword(email,password).catch(e=>{
    err.textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')
      ? 'E-posta veya şifre hatalı.'
      : (e.message||'Giriş yapılamadı.');
    err.style.display='block';
  });
}
function firebaseForgotPassword(){
  const email=document.getElementById('fbEmail').value.trim();
  const err=document.getElementById('fbError');
  const ok=document.getElementById('fbReset');
  err.textContent=''; err.style.display='none';
  ok.textContent=''; ok.style.display='none';
  if(!email){
    err.textContent='Önce e-posta adresinizi yazın.';
    err.style.display='block';
    document.getElementById('fbEmail').focus();
    return;
  }
  firebase.auth().sendPasswordResetEmail(email).then(()=>{
    ok.textContent='✅ Şifre sıfırlama bağlantısı e-posta adresinize gönderildi. Gelen kutunuzu ve spam klasörünü kontrol edin.';
    ok.style.display='block';
  }).catch(e=>{
    let msg='Şifre sıfırlama bağlantısı gönderilemedi.';
    if(e.code==='auth/user-not-found') msg='Bu e-posta adresiyle kayıtlı bir kullanıcı bulunamadı.';
    else if(e.code==='auth/invalid-email') msg='Geçerli bir e-posta adresi girin.';
    err.textContent=msg; err.style.display='block';
  });
}

async function changeLoginPassword(){const msg=document.getElementById('passwordMsg'),cur=document.getElementById('currentPassword')?.value||'',n1=document.getElementById('newPassword')?.value||'',n2=document.getElementById('newPassword2')?.value||'',user=firebase.auth().currentUser;if(!user)return;if(!cur)return msg.innerHTML='<div class="err">Mevcut şifrenizi girin.</div>';if(n1.length<6)return msg.innerHTML='<div class="err">Yeni şifre en az 6 karakter olmalı.</div>';if(n1!==n2)return msg.innerHTML='<div class="err">Yeni şifreler eşleşmiyor.</div>';try{const cred=firebase.auth.EmailAuthProvider.credential(user.email,cur);await user.reauthenticateWithCredential(cred);await user.updatePassword(n1);msg.innerHTML='<div class="ok">✅ Şifreniz başarıyla değiştirildi.</div>';document.getElementById('currentPassword').value='';document.getElementById('newPassword').value='';document.getElementById('newPassword2').value=''}catch(e){let m='Şifre değiştirilemedi.';if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')m='Mevcut şifre hatalı.';else if(e.code==='auth/weak-password')m='Yeni şifre çok zayıf.';msg.innerHTML='<div class="err">'+m+'</div>'}}
function firebaseLogout(){
  firebase.auth().signOut();
}

document.addEventListener('DOMContentLoaded',()=>{
  const gate=document.getElementById('firebaseAuthGate');
  const app=document.getElementById('app');
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(async user=>{
    if(user){
      gate.style.display='none';
      app.style.display='block';
      initTheme();
      try{await loadCloudSettings();}catch(e){console.error('Bulut ayarları okunamadı:',e);updateCloudStatus('error',e.message||'Ayarlar okunamadı');}
      startFirestoreSync(user);startStockSync(user);startSettingsSync(user);loadCustomers().catch(console.error);show();
    }else{
      stopFirestoreSync();stopStockSync();stopSettingsSync();
      app.style.display='none';
      gate.style.display='grid';
    }
  });
});
