<script>
const appEl=document.getElementById('app'), pageEl=document.getElementById('page');
const HOURLY_QUOTES=[
'Başarı, her gün biraz daha iyi hizmet vermenin sonucudur.',
'Müşteriye gösterdiğin özen, işletmenin yarınki kazancıdır.',
'İyi ürün müşteriyi getirir; iyi hizmet müşteriyi geri getirir.',

'İyi planlama yoğunluğu azaltır, hizmet kalitesini artırır.',
'Her siparişi son siparişmiş gibi değil, ilk izlenimmiş gibi hazırla.'
];
function hourlyQuote(){return HOURLY_QUOTES[new Date().getHours()%HOURLY_QUOTES.length]}
function renderHourlyQuote(){const el=document.getElementById('hourlyQuoteText');if(el)el.textContent='“'+hourlyQuote()+'”';const meta=document.getElementById('hourlyQuoteMeta');if(meta){const h=new Date().getHours();meta.textContent='İşletme motivasyonu · '+String(h).padStart(2,'0')+':00';}}
let hourlyQuoteTimer=null;
function startHourlyQuote(){renderHourlyQuote();if(hourlyQuoteTimer)clearInterval(hourlyQuoteTimer);hourlyQuoteTimer=setInterval(renderHourlyQuote,30000);}
const DEFAULT_MENU={"Dürümler":[['Enfes Dürüm',120,100],['Ultra Dürüm',140,120],['Mega Dürüm',170,150],['Double Dürüm',200,200],['Öğrenci Dürüm',120,80]],"Porsiyonlar":[['Küçük Paket',250,300],['Orta Paket',400,500],['Avantaj Paket',470,600],['Büyük Paket',580,750],['Aile Boyu',750,1000]],"Extra":[['Doritos',20,0],['Lavaş',10,0]],"İçecekler":[['Kutu İçecekler',70,0],['Büyük Ayran',45,0],['Küçük Ayran',35,0],['Litrelik İçecekler',90,0],['Şalgam 330 ml',45,0]]};
function loadMenu(){try{let x=JSON.parse(localStorage.getItem('cig_menu')||'null');return x&&typeof x==='object'?x:JSON.parse(JSON.stringify(DEFAULT_MENU))}catch(e){return JSON.parse(JSON.stringify(DEFAULT_MENU))}}
let MENU=loadMenu();
function saveMenu(){localStorage.setItem('cig_menu',JSON.stringify(MENU))}

const STOCK_KEY='cig_stock';
const DEFAULT_STOCK_ITEMS=['Çiğköfte','Lavaş','Nar Ekşisi','Burger Sos','Marul','Doritos','Kutu İçecekler','Büyük Ayran','Küçük Ayran','Litrelik İçecekler','Şalgam 330 ml'];
let STOCK_ITEMS=JSON.parse(localStorage.getItem('cig_stock_items')||'null')||[...DEFAULT_STOCK_ITEMS];
let STOCK_UNITS=Object.assign({'Çiğköfte':'kg','Lavaş':'paket','Nar Ekşisi':'koli','Burger Sos':'koli','Marul':'kasa','Doritos':'adet','Kutu İçecekler':'adet','Büyük Ayran':'adet','Küçük Ayran':'adet','Litrelik İçecekler':'adet','Şalgam 330 ml':'adet'},JSON.parse(localStorage.getItem('cig_stock_units')||'{}'));
const STOCK_DEFAULT_MIN={'Çiğköfte':5,'Lavaş':10,'Nar Ekşisi':1,'Burger Sos':1,'Marul':1};
function saveStockConfig(){localStorage.setItem('cig_stock_items',JSON.stringify(STOCK_ITEMS));localStorage.setItem('cig_stock_units',JSON.stringify(STOCK_UNITS))}
function stockData(){return JSON.parse(localStorage.getItem(STOCK_KEY)||'{}')}
function saveStockData(d){localStorage.setItem(STOCK_KEY,JSON.stringify(d))}
function stockValue(name){let d=stockData();return d[name]?.value===undefined?'':+d[name].value}
function tracked(name){let d=stockData();return Object.prototype.hasOwnProperty.call(d,name)&&d[name]?.value!==''&&d[name]?.value!==undefined}
function stockStatus(name){if(!tracked(name))return '';let v=+stockValue(name)||0,u=STOCK_UNITS[name]||'adet';return `${v} ${u}`}
function consumeForItems(items){let d=stockData();items.forEach(i=>{if(i.grams>0&&STOCK_UNITS['Çiğköfte']){if(tracked('Çiğköfte'))d['Çiğköfte'].value=Math.max(0,(+d['Çiğköfte'].value||0)-((i.grams*i.qty)/1000));}let n=i.name;if(n==='🎁 Sadakat Ödülü - Dürüm + Ayran'){if(tracked('Küçük Ayran'))d['Küçük Ayran'].value=Math.max(0,(+d['Küçük Ayran'].value||0)-i.qty);}else if(n==='Lavaş'||n==='Doritos'||STOCK_UNITS[n]==='adet'){if(tracked(n))d[n].value=Math.max(0,(+d[n].value||0)-i.qty)}});saveStockData(d)}
function restoreStockForItems(items){let d=stockData();items.forEach(i=>{if(i.grams>0&&tracked('Çiğköfte'))d['Çiğköfte'].value=(+d['Çiğköfte'].value||0)+((i.grams*i.qty)/1000);let n=i.name;if(n==='🎁 Sadakat Ödülü - Dürüm + Ayran'){if(tracked('Küçük Ayran'))d['Küçük Ayran'].value=(+d['Küçük Ayran'].value||0)+i.qty;}else if(n==='Lavaş'||n==='Doritos'||STOCK_UNITS[n]==='adet'){if(tracked(n))d[n].value=(+d[n].value||0)+i.qty}});saveStockData(d)}
function requiredStock(items){let r={};items.forEach(i=>{if(i.grams>0)r['Çiğköfte']=(r['Çiğköfte']||0)+(i.grams*i.qty/1000);let n=i.name;if(n==='🎁 Sadakat Ödülü - Dürüm + Ayran')r['Küçük Ayran']=(r['Küçük Ayran']||0)+i.qty;else if(n==='Lavaş'||n==='Doritos'||STOCK_UNITS[n]==='adet')r[n]=(r[n]||0)+i.qty});return r}
function stockCheck(items){let r=requiredStock(items),d=stockData(),bad=[];Object.entries(r).forEach(([n,q])=>{if(tracked(n)&&(+d[n].value||0)+1e-9<q)bad.push(`${n}: ${stockStatus(n)} kaldı, ${q.toFixed(n==='Çiğköfte'?3:0)} ${STOCK_UNITS[n]} gerekli`)});return bad}
let ONLINE=(()=>{try{const x=JSON.parse(localStorage.getItem('cig_online_platforms')||'null');return Array.isArray(x)&&x.length?x:['Yemeksepeti','Trendyol Go','Migros']}catch(e){return ['Yemeksepeti','Trendyol Go','Migros']}})(); let ONLINE_COMMISSION=(()=>{try{return JSON.parse(localStorage.getItem('cig_online_commission')||'{}')}catch(e){return {}}})(); let ONLINE_PRICES=(()=>{try{return JSON.parse(localStorage.getItem('cig_online_prices')||'{}')}catch(e){return {}}})(); const ONLINE_ICONS={'Yemeksepeti':'🛵','Trendyol Go':'🛍️','Migros':'🟢'};
function onlineCommission(platform){return Math.max(0,Math.min(100,+ONLINE_COMMISSION[platform]||0))}
function onlinePrice(platform,name,base){let v=ONLINE_PRICES?.[platform]?.[name];return v===undefined||v===null||v===''?base:Math.max(0,+v||0)}
function onlineNet(order){let gross=+order.total||0,rate=order.onlineCommissionRate!==undefined?+order.onlineCommissionRate:onlineCommission(order.orderType);return gross*(1-Math.max(0,Math.min(100,rate))/100)}
 const TYPES=()=>['Tezgah / Paket',...ONLINE]; let KG=+(localStorage.getItem('cig_costkg')||175);let cat='Dürümler',cart=[],pay='cash',otype='Tezgah / Paket',active='order',editingId=null,editingMeta=null;const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(+n||0);const pad=n=>String(n).padStart(2,'0');const enc=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');const escHtml=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};const month=d=>d.slice(0,7);

// Firestore senkronizasyonu
let db=null, cloudOrders=null, cloudReady=false, cloudSyncUnsub=null, cloudMigrationStarted=false, cloudInitialSyncDone=false, cloudStockUnsub=null, cloudSettingsUnsub=null;
function localOrders(){try{return JSON.parse(localStorage.getItem('cig_orders')||'[]')}catch(e){return []}}

function updateCloudStatus(state,detail=''){

function startFirestoreSync(user){
  if(!db)db=firebase.firestore();
  updateCloudStatus('connecting'); cloudReady=false; cloudMigrationStarted=false; cloudInitialSyncDone=false; cloudOrders=null;
  if(cloudSyncUnsub)cloudSyncUnsub();
  const ref=db.collection('users').doc(user.uid).collection('orders');
  cloudSyncUnsub=ref.onSnapshot(async snap=>{
    const incoming=snap.docs.map(d=>d.data()).sort((a,b)=>(+b.id||0)-(+a.id||0));
    const local=localOrders();
    // İlk bağlantıda Firestore boşsa, eski localStorage verisini yalnızca BİR KEZ buluta aktar.
    // Sonraki boş snapshot'larda local veriyi geri yazma; aksi halde silinen siparişler yeniden oluşur.
    if(!cloudInitialSyncDone){
      cloudInitialSyncDone=true;
      if(snap.empty && local.length>0){
        cloudMigrationStarted=true;
        cloudOrders=local; setLocalOrders(local); cloudReady=false; updateCloudStatus('connecting','Eski yerel veriler güvenli şekilde buluta aktarılıyor…'); 
        try{
          await syncOrdersToCloud(local);
          cloudReady=true; updateCloudStatus('ready'); 
        }
        catch(e){
          console.error('Firestore ilk aktarım hatası:',e);
          cloudMigrationStarted=false; cloudInitialSyncDone=false; cloudReady=false;
          updateCloudStatus('error',e.message||'İlk veri aktarımı başarısız');
          const m=document.getElementById('msg'); if(m)m.innerHTML='<div class="err">Bulut aktarımı başarısız oldu. Sağ üstteki bulut düğmesine basıp tekrar deneyin.</div>';
        }
      }else{
        cloudOrders=incoming; setLocalOrders(incoming); cloudReady=true; updateCloudStatus('ready'); 
      }
      return;
    }
    // İlk senkron tamamlandıktan sonra Firestore tek gerçek kaynak olur.
    cloudOrders=incoming; setLocalOrders(incoming); cloudReady=true; updateCloudStatus('ready'); 
  },err=>{console.error('Firestore dinleme hatası:',err);cloudReady=false;updateCloudStatus('error',err.code||err.message||'Firestore bağlantı hatası');const m=document.getElementById('msg');if(m)m.innerHTML='<div class="err">Bulut verilerine bağlanılamadı. Sağ üstteki bulut düğmesine basarak tekrar deneyin.</div>';});
}
function stopFirestoreSync(){if(cloudSyncUnsub){cloudSyncUnsub();cloudSyncUnsub=null}cloudOrders=null;cloudReady=false;cloudInitialSyncDone=false;updateCloudStatus('connecting')}

async function persistSettings(msg='✓ Ayarlar kaydedildi.') { saveMenu(); saveStockConfig(); try{await saveCloudSettings();}catch(e){console.error(e);alert('Buluta kaydedilemedi. İnternet bağlantısını kontrol edin.');return false} const m=document.getElementById('settingsMsg');if(m)m.innerHTML='<div class="ok">'+msg+'</div>';return true }
async function saveCostSetting(){KG=Math.max(0,+document.getElementById('costKg').value||0);localStorage.setItem('cig_costkg',String(KG));await persistSettings('✓ Maliyet ve ayarlar kaydedildi.');}
async function saveMenuSettings(){Object.keys(MENU).forEach(cat=>MENU[cat].forEach((p,i)=>{const nm=document.getElementById(`name_${encodeURIComponent(cat)}_${i}`)?.value.trim();if(nm)p[0]=nm;p[1]=Math.max(0,+document.getElementById(`price_${encodeURIComponent(cat)}_${i}`).value||0);p[2]=Math.max(0,+document.getElementById(`gram_${encodeURIComponent(cat)}_${i}`).value||0)}));await persistSettings('✓ Menü adı, fiyat ve gramajlar kaydedildi.');if(active==='order')renderOrder()}
async function addCustomProduct(){let cat=document.getElementById('newCat').value,name=document.getElementById('newName').value.trim(),price=Math.max(0,+document.getElementById('newPrice').value||0),gram=Math.max(0,+document.getElementById('newGram').value||0);if(!name||!price){alert('Ürün adı ve fiyat girin.');return}MENU[cat].push([name,price,gram]);await persistSettings('✓ Ürün eklendi.');renderSettings('menu')}

}

async function saveOperation(type){
  const amount=Math.max(0,+document.getElementById('opAmount').value||0);
  const grams=Math.max(0,+document.getElementById('opGrams').value||0);
  const note=(document.getElementById('opNote').value||'').trim();
  if(type!=='Fire' && !note)return alert('Açıklama girin.');
  if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');
  const o={id:Date.now(),businessDate:today(),createdAt:new Date().toISOString(),type,amount,grams,note};
  try{await saveCloudOperation(o);if((type==='Fire'||type==='İkram')&&grams>0&&tracked('Çiğköfte')){let d=stockData();d['Çiğköfte'].value=Math.max(0,(+d['Çiğköfte'].value||0)-(grams/1000));saveStockData(d);try{await saveCloudStock()}catch(stockErr){console.error(stockErr)}}await renderOperations(today());}catch(e){console.error(e);alert('Kayıt buluta yazılamadı.');}
}
async function removeOperation(id){
  if(!confirm('Bu kaydı silmek istiyor musunuz?'))return;
  try{
    const events=await loadCloudOperations(today());
    const old=events.find(o=>String(o.id)===String(id));
    await deleteCloudOperation(id);
    if((old?.type==='Fire'||old?.type==='İkram') && (+old.grams||0)>0 && tracked('Çiğköfte')){
      const d=stockData();
      d['Çiğköfte'].value=(+d['Çiğköfte'].value||0)+((+old.grams||0)/1000);
      saveStockData(d);
      try{await saveCloudStock();}catch(stockErr){console.error(stockErr);alert('İşlem silindi fakat fire stok iadesi buluta senkronlanamadı. Stok ekranını kontrol edin.');}
    }
    await renderOperations(today());
  }catch(e){console.error(e);alert('Kayıt silinemedi.');}
}
async function saveCashCheck(date){
  const expected=Math.max(0,+document.getElementById('cashExpected').value||0),counted=Math.max(0,+document.getElementById('cashCounted').value||0);
  if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');
  const o={id:'cash-'+date,businessDate:date,createdAt:new Date().toISOString(),type:'Kasa Sayımı',expected,counted,diff:+(counted-expected).toFixed(2)};
  try{await saveCloudOperation(o);await renderOperations(date);}catch(e){console.error(e);alert('Kasa sayımı kaydedilemedi.');}
}

async function renderStock(){
 const d=stockData(),purchases=await loadCloudPurchases(),suppliers=await loadCloudSuppliers();
 const cards=STOCK_ITEMS.map(n=>{const v=tracked(n)?(+d[n].value||0):null,unit=STOCK_UNITS[n],min=tracked(n)?(+d[n].min||0):0,low=v!==null&&min>0&&v<=min;return `<div class="stock-card ${v!==null&&v<=0?'out':''} ${low?'low':''}"><b>${n}</b><div class="muted">Birim: ${unit}</div><div style="display:flex;gap:6px;align-items:center"><button type="button" onclick="adjustStock('${enc(n)}',-1)" style="width:42px;padding:10px;border-radius:10px">−</button><input class="stock-input" data-stock="${n}" type="number" min="0" step="${unit==='kg'?'0.001':'1'}" placeholder="Takip kapalı" value="${v===null?'':v}" style="flex:1"><button type="button" onclick="adjustStock('${enc(n)}',1)" style="width:42px;padding:10px;border-radius:10px">+</button></div><div class="stock-mini">Kritik alt sınır</div><input class="stock-input" data-min="${n}" type="number" min="0" step="${unit==='kg'?'0.001':'1'}" value="${v===null?'':min}"><div class="stock-current ${v!==null&&v<=0?'out':low?'low':''}">${v===null?'Takip kapalı':low?'⚠️ Kritik: '+v+' '+unit:v+' '+unit}</div></div>`}).join('');
 const ph=purchases.slice(0,30).map(o=>`<div class="purchase-row"><div><b>${escHtml(o.businessDate||'')}</b> • ${escHtml(o.supplier||'-')}</div><div>${(o.items||[]).map(i=>`${escHtml(i.name)}: ${i.qty} ${escHtml(i.unit||'')}`).join(' • ')}</div><b>${money(o.total||0)}</b></div>`).join('')||'<p class="muted">Henüz alım kaydı yok.</p>';
 const sh=suppliers.map(x=>`<div class="supplier-row"><div><b>${x.name}</b><span>${x.phone||''}</span></div><button onclick="removeSupplier('${x.id}')">Sil</button></div>`).join('')||'<p class="muted">Henüz tedarikçi yok.</p>';
 pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>📦 Stok & Alım Takibi</h2><p>Stok, kritik uyarılar ve geçmiş alımlar.</p></div><div><button class="primary" style="width:auto;margin-top:0" onclick="saveAllStock()">💾 Stokları Kaydet</button><button class="danger stock-reset-btn" onclick="resetAllStock()">🗑️ Tüm Stokları Sıfırla</button><button onclick="view('procurement')">🛒 Yarınki Sipariş</button></div></div><div class="stock-grid">${cards}</div><section class="panel report-panel"><h3>➕ Malzeme Alımı</h3><div class="proc-grid"><div class="field"><label>Tedarikçi</label><select id="purchaseSupplier">${suppliers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div><div class="field"><label>Alım tarihi</label><input id="purchaseDate" type="date" value="${today()}"></div><div class="field"><label>Not</label><input id="purchaseNote" placeholder="İrsaliye / not"></div></div><div class="purchase-items">${STOCK_ITEMS.map((n,i)=>`<div class="purchase-item"><b>${n}</b><small>${STOCK_UNITS[n]}</small><input id="buy_${i}" type="number" min="0" step="${STOCK_UNITS[n]==='kg'?'0.001':'1'}" placeholder="Miktar"><input id="buyprice_${i}" type="number" min="0" step="0.01" placeholder="Birim fiyat"></div>`).join('')}</div><button class="primary" onclick="savePurchase()">📥 Alımı Kaydet ve Stoğa Ekle</button></section><section class="panel report-panel"><h3>🚚 Tedarikçiler</h3><div class="proc-grid"><div class="field"><label>Tedarikçi adı</label><input id="supplierName" placeholder="Örn. ABC Distribütör"></div><div class="field"><label>WhatsApp numarası</label><input id="supplierPhone" inputmode="tel" placeholder="905xxxxxxxxx"></div><button class="primary" onclick="saveSupplier()">+ Tedarikçi Ekle</button></div><div class="supplier-list">${sh}</div></section><section class="panel report-panel"><div class="sectionhead"><h3>📋 Geçmiş Alımlar</h3><span class="muted">Son 30 kayıt</span></div>${ph}</section></section>`;
}
function adjustStock(encoded,delta){const n=decodeURIComponent(encoded),d=stockData(),unit=STOCK_UNITS[n]||'adet';if(!tracked(n)){d[n]={value:0,unit,min:STOCK_DEFAULT_MIN[n]||0};}const step=unit==='kg'?0.001:1;d[n].value=Math.max(0,(+d[n].value||0)+delta*step);d[n].unit=unit;saveStockData(d);saveCloudStock().catch(console.error);renderStock();}
async function resetAllStock(){if(!confirm('TÜM stoklar sıfırlansın mı? Bu işlem buluttaki ve cihazdaki tüm mevcut stok miktarlarını 0 yapar.'))return;if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');const d=stockData();STOCK_ITEMS.forEach(n=>{d[n]={...(d[n]||{}),value:0,unit:STOCK_UNITS[n]||d[n]?.unit||'adet',min:+(d[n]?.min??STOCK_DEFAULT_MIN[n]??0)}});try{const ref=db.collection('users').doc(firebase.auth().currentUser.uid).collection('stock'),snap=await ref.get(),batch=db.batch();snap.docs.forEach(doc=>{const x=doc.data()||{};batch.set(doc.ref,{...x,value:0,updatedAt:new Date().toISOString()},{merge:true})});Object.entries(d).forEach(([name,v])=>batch.set(ref.doc(encodeURIComponent(name)),{name,value:0,unit:v.unit||STOCK_UNITS[name]||'adet',min:+v.min||0,updatedAt:new Date().toISOString()},{merge:true}));await batch.commit();saveStockData(d);renderStock();alert('Tüm stoklar sıfırlandı.');}catch(e){console.error(e);alert('Stoklar sıfırlanamadı. Lütfen tekrar deneyin.')}}

function saveAllStock(){let d=stockData();document.querySelectorAll('[data-stock]').forEach(i=>{let n=i.dataset.stock,v=i.value.trim();if(v==='')delete d[n];else d[n]={...(d[n]||{}),value:+v,unit:STOCK_UNITS[n],min:+(document.querySelector(`[data-min="${n}"]`)?.value||STOCK_DEFAULT_MIN[n]||0)}});saveStockData(d);saveCloudStock().catch(console.error);renderStock()}
async function savePurchase(){const supplierId=document.getElementById('purchaseSupplier')?.value;const suppliers=await loadCloudSuppliers();const supplier=suppliers.find(x=>String(x.id)===String(supplierId));if(!supplier)return alert('Önce tedarikçi ekleyin.');const date=document.getElementById('purchaseDate').value||today(),d=stockData(),items=[];let total=0;STOCK_ITEMS.forEach((n,i)=>{const q=Math.max(0,+document.getElementById('buy_'+i).value||0),price=Math.max(0,+document.getElementById('buyprice_'+i).value||0);if(q){const old=d[n]||{value:0,unit:STOCK_UNITS[n],min:STOCK_DEFAULT_MIN[n]||0};d[n]={...old,value:(+old.value||0)+q,unit:STOCK_UNITS[n]};items.push({name:n,qty:q,unit:STOCK_UNITS[n],unitPrice:price,total:q*price});total+=q*price;}});if(!items.length)return alert('En az bir ürün miktarı girin.');if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');const o={id:Date.now(),businessDate:date,createdAt:new Date().toISOString(),supplier:supplier.name,supplierId:supplier.id,items,total,note:(document.getElementById('purchaseNote').value||'').trim()};try{await savePurchaseAndStockCloud(o,d);saveStockData(d);await renderStock();alert('Alım kaydedildi ve stoğa eklendi.');}catch(e){console.error(e);alert('Alım kaydedilemedi; stok ve alım birlikte geri bırakıldı.');}}
async function saveSupplier(){const name=(document.getElementById('supplierName').value||'').trim(),phone=(document.getElementById('supplierPhone').value||'').replace(/\D/g,'');if(!name||!phone)return alert('Tedarikçi adı ve WhatsApp numarası girin.');if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesine basıp tekrar deneyin.');try{await saveSupplierCloud({id:Date.now(),name,phone});await renderStock();}catch(e){console.error(e);alert('Tedarikçi kaydedilemedi.');}}
async function removeSupplier(id){if(!confirm('Tedarikçi silinsin mi?'))return;try{await deleteSupplierCloud(id);await renderStock();}catch(e){console.error(e);alert('Tedarikçi silinemedi.');}}

function distributorMonths(os){const set=new Set((os||[]).map(o=>month(o.businessDate)));const now=month(today());set.add(now);const a=[...set].sort();if(!a.length)return[now];const f=a[0].split('-').map(Number),l=now.split('-').map(Number),out=[];let y=f[0],m=f[1];while(y<l[0]||(y===l[0]&&m<=l[1])){out.push(`${y}-${pad(m)}`);m++;if(m>12){m=1;y++}}return out}
function distributorDebtRows(os){let carry=0;return distributorMonths(os).map(ym=>{const purchases=(os||[]).filter(o=>month(o.businessDate)===ym).reduce((s,o)=>s+(+o.total||0),0),opening=carry,due=opening+purchases,rec=distributorPayments[ym]||{},paid=Math.min(Math.max(0,+rec.paid||0),due),remaining=Math.max(0,due-paid);carry=remaining;return{ym,opening,purchases,due,paid,remaining,paymentDate:rec.date||'',status:remaining===0&&due>0?'paid':paid>0?'partial':'unpaid'}})}
async function saveDistributorPayment(){const ym=document.getElementById('distPayMonth')?.value||month(today()),os=await loadDistributorOrders(),row=distributorDebtRows(os).find(x=>x.ym===ym);if(!row)return;const paid=Math.max(0,+document.getElementById('distPaidAmount')?.value||0);if(paid>row.due)return alert(`Ödeme borçtan fazla olamaz. En fazla ${money(row.due)}.`);distributorPayments[ym]={paid,date:document.getElementById('distPaymentDate')?.value||today(),status:paid>=row.due&&row.due>0?'paid':paid>0?'partial':'unpaid'};await saveDistributorDebtData();renderDistributor()}
function clearDistributorPayment(ym){if(!confirm(`${ym} ayının ödeme kaydı silinsin mi?`))return;delete distributorPayments[ym];saveDistributorDebtData().then(renderDistributor)}
async function loadDistributorOrders(){if(!db||!firebase.auth().currentUser)return [];const uid=firebase.auth().currentUser.uid;const snap=await db.collection('users').doc(uid).collection('procurementOrders').get();return snap.docs.map(d=>d.data()).sort((a,b)=>String(b.businessDate).localeCompare(String(a.businessDate))||(+b.id||0)-(+a.id||0))}
function applyDistributorStock(items,sign=1){const d=stockData();(items||[]).forEach(x=>{const n=x.name;if(!STOCK_ITEMS.includes(n)){STOCK_ITEMS.push(n);STOCK_UNITS[n]=x.unit||'adet'}const old=d[n]||{value:0,unit:x.unit||STOCK_UNITS[n]||'adet',min:STOCK_DEFAULT_MIN[n]||0};d[n]={...old,value:Math.max(0,(+old.value||0)+sign*(+x.qty||0)),unit:x.unit||old.unit||STOCK_UNITS[n]||'adet'}});saveStockData(d);return d}
async function deleteDistributorOrder(id){if(!confirm('Bu alım silinsin mi?'))return;if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');const os=await loadDistributorOrders(),old=os.find(x=>String(x.id)===String(id));try{const uid=firebase.auth().currentUser.uid;await db.collection('users').doc(uid).collection('procurementOrders').doc(String(id)).delete();if(old){const d=applyDistributorStock(old.items||[],-1);saveStockConfig();await saveCloudStock()}renderDistributor()}catch(e){console.error(e);alert('Alım silinemedi.')}}
function distributorQtyTotal(items){return (items||[]).filter(x=>x.unit==='kg'&&x.name==='Çiğköfte').reduce((s,x)=>s+(+x.qty||0),0)}
function distributorShipping(kg,items=[]){kg=Math.max(0,+kg||0);const nonZero=(items||[]).filter(x=>(+x.qty||0)>0);const lavash=nonZero.filter(x=>String(x.name).toLowerCase()==='lavaş').reduce((s,x)=>s+(+x.qty||0),0);const onlyKofteAndLavash=nonZero.length===2&&nonZero.some(x=>String(x.name).toLowerCase()==='çiğköfte')&&nonZero.some(x=>String(x.name).toLowerCase()==='lavaş');if(kg===10&&lavash===2&&onlyKofteAndLavash)return 150;if(kg>10)return 300;if(nonZero.some(x=>String(x.unit||'').toLowerCase()==='koli')&&kg>=10)return 300;return 0}
function distributorTotal(items){const base=(items||[]).reduce((s,x)=>s+(+x.total||(+x.qty||0)*(+x.unitPrice||0)),0);return base+distributorShipping(distributorQtyTotal(items),items)}
async function saveDistributorOrder(){
 const date=document.getElementById('distDate')?.value||today(),note=(document.getElementById('distNote')?.value||'').trim(),items=[];
 DISTRIBUTOR_PRODUCTS.forEach((p,i)=>{const q=Math.max(0,+document.getElementById('distQty_'+i)?.value||0),price=Math.max(0,+document.getElementById('distPrice_'+i)?.value||0);if(q)items.push({name:p.name,qty:q,unit:p.unit,unitPrice:price,total:+(q*price).toFixed(2)})});
 if(!items.length)return alert('En az bir ürün miktarı girin.');
 const kg=distributorQtyTotal(items),shipping=distributorShipping(kg,items),base=items.reduce((s,x)=>s+x.total,0),o={id:distributorEditId||Date.now(),businessDate:date,createdAt:new Date().toISOString(),items,baseTotal:+base.toFixed(2),shipping:+shipping.toFixed(2),total:+(base+shipping).toFixed(2),note};
 if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı. Sağ üstteki bulut düğmesini kontrol edin.');
 try{
   const os=await loadDistributorOrders(),old=distributorEditId?os.find(x=>String(x.id)===String(distributorEditId)):null;
   let d=stockData();
   if(old)d=applyDistributorStock(old.items||[],-1);
   d=applyDistributorStock(items,1);
   saveStockConfig();saveStockData(d);
   await saveDistributorAndStockCloud(o,d);
   distributorEditId=null;await renderDistributor();
 }catch(e){
   console.error('Distribütör alımı kaydetme hatası:',e);
   const code=e?.code||'',detail=e?.message||String(e);
   alert('Distribütör alımı kaydedilemedi.\n\n'+(code?code+' — ':'')+detail);
 }
}
async function addDistributorProduct(){const name=(document.getElementById('newDistName')?.value||'').trim(),unit=document.getElementById('newDistUnit')?.value||'adet',price=Math.max(0,+document.getElementById('newDistPrice')?.value||0);if(!name)return alert('Ürün adı girin.');if(DISTRIBUTOR_PRODUCTS.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('Bu ürün zaten listede.');DISTRIBUTOR_PRODUCTS.push({name,unit,price});await persistSettings('✓ Distribütör ürünü eklendi.');renderDistributor()}

=Math.min(100,x.remaining/max*100);return `<div class="debt-chart-row"><div class="debt-chart-label"><b>${x.ym}</b><span>${money(x.due)}</span></div><div class="debt-bar"><span class="bar-paid" style="width:${p}%"></span><span class="bar-remaining" style="width:${r}%;left:${p}%"></span></div><div class="debt-chart-legend"><span class="debt-green">● Ödenen ${money(x.paid)}</span><span class="debt-red">● Kalan ${money(x.remaining)}</span></div></div>`}).join('');pageEl.innerHTML=`<section class="panel"><div class="sectionhead"><div><h2>🚚 Distribütör / Alımlar</h2><p>Sabit ürün fiyatları, kargo ve distribütöre borç takibi.</p></div></div><div class="report-grid"><div class="stat"><span>Bu Ay Toplam Borç</span><b>${money(cur.due)}</b></div><div class="stat"><span class="debt-green">Bu Ay Ödenen</span><b class="debt-green">${money(cur.paid)}</b></div><div class="stat"><span class="debt-red">Bu Ay Kalan / Devir</span><b class="debt-red">${money(cur.remaining)}</b></div><div class="stat"><span>Toplam Kalan Borç</span><b>${money(allDebt)}</b></div></div><section class="panel report-panel"><h3>${edit?'✏️ Alımı Düzenle':'➕ Yeni Distribütör Alımı'}</h3><div class="proc-grid"><div class="field"><label>Tarih</label><input id="distDate" type="date" value="${edit?.businessDate||today()}"></div><div class="field wide"><label>Not</label><input id="distNote" value="${escHtml(edit?.note||'')}" placeholder="Fatura / not"></div></div><div class="purchase-items">${prod}</div><div class="settings-add"><h3>➕ Manuel Ürün Ekle</h3><div class="proc-grid"><div class="field"><label>Ürün adı</label><input id="newDistName" placeholder="Örn. Mezopotamya Sosu"></div><div class="field"><label>Birim</label><select id="newDistUnit"><option>adet</option><option>koli</option><option>kg</option><option>paket</option></select></div><div class="field"><label>Birim fiyatı</label><input id="newDistPrice" type="number" min="0" step="0.01"></div><button onclick="addDistributorProduct()">Ürünü Ekle</button></div></div><div class="settings-list" style="margin:12px 0">${DISTRIBUTOR_PRODUCTS.map((p,i)=>`<div class="settings-row"><div class="settings-name"><b>${escHtml(p.name)}</b><small>Fiyat / birim düzenleme</small></div><div class="field"><label>Birim</label><select id="distBaseUnit_${i}"><option ${p.unit==='adet'?'selected':''}>adet</option><option ${p.unit==='koli'?'selected':''}>koli</option><option ${p.unit==='kg'?'selected':''}>kg</option><option ${p.unit==='paket'?'selected':''}>paket</option></select></div><div class="field"><label>Fiyat</label><input id="distBasePrice_${i}" type="number" min="0" step="0.01" value="${p.price}"></div><button class="danger" onclick="removeDistributorProduct(${i})">Sil</button></div>`).join('')}</div><button onclick="saveDistributorProductPrices()">💾 Ürün Fiyat/Birimlerini Kaydet</button><div class="footer-help">Kargo: yalnızca 10 kg + 2 paket lavaş = 150 TL. 10 kg üzeri tüm siparişler = 300 TL. Koli içeren 10 kg ve üzeri alımlar da = 300 TL.</div><button class="primary" onclick="saveDistributorOrder()">💾 ${edit?'Değişiklikleri Kaydet':'Alımı Kaydet'}</button>${edit?'<button onclick="distributorEditId=null;renderDistributor()">İptal</button>':''}</section><section class="panel report-panel"><h3>💳 Distribütör Borç Ödeme</h3><div class="proc-grid"><div class="field"><label>Ay</label><input id="distPayMonth" type="month" value="${ym}"></div><div class="field"><label>Ödeme tarihi</label><input id="distPaymentDate" type="date" value="${today()}"></div><div class="field"><label>Ödenen tutar (TL)</label><input id="distPaidAmount" type="number" min="0" step="0.01" value="${cur.paid||''}" placeholder="Örn. 5000"></div><button class="primary" onclick="saveDistributorPayment()">💚 Ödemeyi Kaydet</button></div><div class="footer-help">Tam ödeme: <b class="debt-green">Borç Ödendi</b>. Kısmi/ödenmeyen tutar sonraki aya otomatik devreder.</div></section><section class="panel report-panel"><h3>📊 Ay Bazında Borç • Ödeme • Devir</h3>${chart}<div class=" async function filterDistributorMonth(ym){const os=await loadDistributorOrders(),f=os.filter(o=>month(o.businessDate)===ym),x=distributorDebtRows(os).find(x=>x.ym===ym)||{opening:0,purchases:0,due:0,paid:0,remaining:0};const el=document.getElementById('distHistory');if(el)el.innerHTML=`<div class="debt-month"><div class="debt-head"><b>${ym}</b><span class="${x.remaining?'debt-red':'debt-green'}">${x.remaining?'Kalan Borç '+money(x.remaining):'Borç Ödendi'}</span></div><div class="debt-grid"><span>Geçen aydan devreden borç</span><b>${money(x.opening)}</b><span>Bu ay alım</span><b>${money(x.purchases)}</b><span>Toplam borç</span><b>${money(x.due)}</b><span class="debt-green">Ödenen</span><b class="debt-green">${money(x.paid)}</b><span class="debt-red">Devreden</span><b class="debt-red">${money(x.remaining)}</b></div></div>${f.map(o=>`<div class="purchase-row"><div><b>${o.businessDate}</b><br>${(o.items||[]).map(i=>`${escHtml(i.name)}: ${i.qty} ${i.unit}`).join(' • ')}</div><div><b>${money(o.total)}</b></div><div><button onclick="editDistributorOrder(${o.id})">Düzenle</button><button class="danger" onclick="deleteDistributorOrder(${o.id})">Sil</button></div></div>`).join('')||'<p class="muted">Bu ay alım yok.</p>'}`}

async function procurementMessage(){const s=await getSelectedSupplier(),items=procurementItems(),date=document.getElementById('orderDate')?.value||'',note=(document.getElementById('orderNote')?.value||'').trim();return {supplier:s,items,date,note,message:`Merhaba, OSES için ${date} tarihli siparişimiz:\n\n${items.map(x=>`• ${x.qty} ${x.unit} ${x.name}`).join('\n')}\n\n${note?note+'\n\n':''}Teşekkürler.`}}

async function readCloudCollection(name){if(!db||!firebase.auth().currentUser)return [];const uid=firebase.auth().currentUser.uid;const snap=await db.collection('users').doc(uid).collection(name).get();return snap.docs.map(d=>d.data())}
async function writeCloudCollection(name,docs){if(!db||!firebase.auth().currentUser)return;const uid=firebase.auth().currentUser.uid;for(let i=0;i<docs.length;i+=450){const batch=db.batch();docs.slice(i,i+450).forEach(o=>{const id=String(o.id);batch.set(db.collection('users').doc(uid).collection(name).doc(id),o,{merge:true})});if(docs.slice(i,i+450).length)await batch.commit()}}
async function backupData(){if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');try{const data={version:2,createdAt:new Date().toISOString(),orders:orders(),operations:await readCloudCollection('operations'),stock:stockData(),purchases:await readCloudCollection('purchases'),suppliers:await readCloudCollection('suppliers'),customers:await readCloudCollection('customers'),procurementOrders:await readCloudCollection('procurementOrders'),settings:{menu:MENU,stockItems:STOCK_ITEMS,stockUnits:STOCK_UNITS,kgCost:KG,onlinePlatforms:ONLINE,onlineCommission:ONLINE_COMMISSION,onlinePrices:ONLINE_PRICES,distributorPayments}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`oses-yedek-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){console.error(e);alert('Yedek oluşturulamadı.')}}
async function restoreData(input){const file=input?.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||typeof data!=='object')throw new Error('Geçersiz yedek');if(!confirm('Yedek veriler mevcut verilerle birleştirilsin mi? Eşleşen kayıtlar güncellenecek.')){input.value='';return}if(!(await waitForCloud()))return alert('Bulut bağlantısı kurulamadı.');if(Array.isArray(data.orders))await writeCloudCollection('orders',data.orders);if(Array.isArray(data.operations))await writeCloudCollection('operations',data.operations);if(Array.isArray(data.purchases))await writeCloudCollection('purchases',data.purchases);if(Array.isArray(data.suppliers))await writeCloudCollection('suppliers',data.suppliers);if(Array.isArray(data.procurementOrders))await writeCloudCollection('procurementOrders',data.procurementOrders);if(data.stock&&typeof data.stock==='object'){saveStockData(data.stock);await saveCloudStock()}if(data.settings&&typeof data.settings==='object'){const d=data.settings;applyCloudSettings(d);await saveCloudSettings()}if(Array.isArray(data.orders)){cloudInitialSyncDone=true}await new Promise(r=>setTimeout(r,700));alert('Yedek geri yüklendi.');renderHistory(lastHistoryState||{});}catch(e){console.error(e);alert('Yedek geri yüklenemedi. Dosya bozuk veya uyumsuz olabilir.')}finally{if(input)input.value=''}}
